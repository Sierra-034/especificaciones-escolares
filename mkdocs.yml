site_name: Especificaciones escolares
site_url: https://Sierra-034.github.io/especificaciones-escolares/
repo_url: https://github.com/Sierra-034/especificaciones-escolares
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  _plantilla*.md
theme:
  name: material
  language: es
  features:
    - navigation.sections
    - content.action.edit
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
nav:
  - Inicio: index.md
  - Principios: principios.md
  - Historias: historias/index.md
  - Especificaciones:
      - Índice: especificaciones/index.md
      - ESP-IDP Identidad: especificaciones/ESP-IDP.md
      - ESP-CON Constancias: especificaciones/ESP-CON.md
      - ESP-PLA Acceso al plantel: especificaciones/ESP-PLA.md
  - Decisiones (ADR): adr/index.md
  - Proceso:
      - Manual: proceso/index.md
      - 0 · Preparar tu equipo: proceso/0-preparar-equipo.md
      - A · Proponer un cambio: proceso/A-proponer-cambio.md
      - B · Publicar una versión: proceso/B-publicar-version.md
      - C · Fijar la versión: proceso/C-fijar-version.md
      - D · Corregir una versión: proceso/D-corregir-version.md
  - Retrospectivas:
      - Índice: retrospectivas/index.md
      - 2026-11-13 · Arranque: retrospectivas/2026-11-13.md
